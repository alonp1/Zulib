name: build
# Builds Zulib.dll from source on Mono (the toolchain of release 0.3.43) and keeps it as a workflow artifact.
on:
  push:
    branches: [bitzen-protocol]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mono:6.12
      volumes:
        - /etc/ssl/certs:/hostcerts:ro
    steps:
      - name: Tools
        run: |
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g; s|deb.debian.org/debian|archive.debian.org/debian|g; s|security.debian.org|archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -qq && apt-get install -y -qq git ca-certificates libgomp1 >/dev/null
          which fsharpc || true
          cert-sync --quiet /hostcerts/ca-certificates.crt
      - uses: actions/checkout@v4
      - name: Restore
        shell: bash
        run: |
          RC=0; mono .paket/paket.exe restore > /tmp/r.txt 2>&1 || RC=$?
          tail -n 30 /tmp/r.txt
          tail -n 9 /tmp/r.txt | cut -c1-400 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=restore::$l"; done
          exit $RC
      - name: Build
        shell: bash
        run: |
          ls packages | head -n 40
          RC=0; ./build-plain.sh > /tmp/b.txt 2>&1 || RC=$?
          tail -n 60 /tmp/b.txt
          grep -E "error|Error|rror FS|refs:" /tmp/b.txt | sort -u | head -n 9 | cut -c1-400 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=build::$l"; done
          exit $RC
      - uses: actions/upload-artifact@v4
        with:
          name: zulib
          path: bin/
