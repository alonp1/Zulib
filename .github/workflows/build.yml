name: build
# Builds Zulib.dll from source on Mono (the toolchain of release 0.3.43) and keeps it as a workflow artifact.
on:
  push:
    branches: [bitzen-protocol]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: mono:6.12
    steps:
      - name: Tools
        run: |
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g; s|deb.debian.org/debian|archive.debian.org/debian|g; s|security.debian.org|archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update -qq && apt-get install -y -qq git ca-certificates libgomp1 >/dev/null
          which fsharpc || true
      - uses: actions/checkout@v4
      - name: Restore
        shell: bash
        run: |
          mono .paket/paket.exe restore > /tmp/r.txt 2>&1; RC=$?
          tail -n 30 /tmp/r.txt
          tail -n 9 /tmp/r.txt | cut -c1-400 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=restore::$l"; done
          exit $RC
      - name: Extract
        shell: bash
        run: |
          set -o pipefail
          ./build.sh Extract > /tmp/ex.txt 2>&1; RC=$?
          tail -n 40 /tmp/ex.txt
          grep -i -E "error|fail" /tmp/ex.txt | head -n 8 | cut -c1-400 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=extract::$l"; done
          ls fsharp/Extracted | head -n 40
          exit $RC
      - name: Build
        shell: bash
        run: |
          ./build.sh Build > /tmp/b.txt 2>&1; RC=$?
          tail -n 60 /tmp/b.txt
          grep -i -E "error|fail" /tmp/b.txt | sort -u | head -n 9 | cut -c1-400 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=build::$l"; done
          ls -la bin || true
          test -f bin/Zulib.dll
      - uses: actions/upload-artifact@v4
        with:
          name: zulib
          path: bin/
